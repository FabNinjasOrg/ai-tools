server {
    listen 80;
    server_name 3-109-126-237.nip.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 3-109-126-237.nip.io;

    ssl_certificate     /etc/letsencrypt/live/3-109-126-237.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-109-126-237.nip.io/privkey.pem;

    root /var/www/html/public;
    client_max_body_size 1024M; # Prevent gateway timeout on large uploads
    fastcgi_read_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    index index.php index.html;

    location ^~ /build/ {
        try_files $uri $uri/ =404;
    }

    location /favicon.ico {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass face_finder_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
