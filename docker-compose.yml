services:
  nginx:
    image: nginx:alpine
    container_name: laravel_ai_nginx
    ports:
      - "80:80"
      - "6274:6274" # MCP Inspector
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_ai_app
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
      - ./local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql-test:
        condition: service_started
    networks:
      - laravel-net
    models:
      llm:        
        endpoint_var: AI_MODEL_URL
        model_var: AI_MODEL_NAME

  mysql-test:
    image: mysql:8.0
    container_name: mysql8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: laravel
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net        

models:
  llm:
    model: ai/llama3.2:latest

volumes:
  db_data:

networks:
  laravel-net:
    driver: bridge
