services:
  nginx:
    image: nginx:alpine
    container_name: laravel_ai_nginx
    ports:
      - "80:80"
      - "6274:6274" # MCP Inspector
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_ai_app
    volumes:
      - ./:/var/www
      - ./local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql-test:
        condition: service_started
    networks:
      - laravel-net

  mysql-test:
    image: mysql:8.0
    container_name: mysql8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: laravel
    command: --max_connections=500
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net

  cron:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: laravel_ai_app_cron
      volumes:
        - ./:/var/www
      command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf", "-n"]
      depends_on:
        - mysql-test
      networks:
        - laravel-net

  fastapi:
    build:
      context: ./fast-api-face-rec
      dockerfile: Dockerfile
    container_name: face_finder_fastapi
    ports:
      - "8005:8005"
    networks:
      - laravel-net
    depends_on:
      - app

models:
  llama3.2:
    model: ai/llama3.2

volumes:
  db_data:

networks:
  laravel-net:
    driver: bridge
