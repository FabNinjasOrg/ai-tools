name: Local CD Build

on:
  workflow_dispatch:
  push:
      branches:
        - testing-facefinder

jobs:
  deploy-local:
    runs-on: ubuntu-latest

    steps:

      # Checkout Code

      - name: Checkout Code
        uses: actions/checkout@v3

      # Install PHP 8.2

      - name: Install PHP 8.2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install -y \
            php8.2 php8.2-cli php8.2-common php8.2-mbstring php8.2-xml \
            php8.2-zip php8.2-intl php8.2-curl php8.2-bcmath php8.2-gd php8.2-mysql

      # Install Composer

      - name: Install Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git libzip-dev libicu-dev
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer

      # Composer Install

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      # Install Node Dependencies + Build Vite

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Vite Assets
        run: npm run build

      # Docker Compose Build (Local Image Build)

      - name: Build Docker Images Locally
        run: |
          docker compose build


      # Start All Containers Locally

      - name: Start Docker Containers Locally
        run: |
          docker compose up -d


      # Run Database Migrations

      - name: Run Laravel Migrations Locally
        run: |
          docker compose exec -T app php artisan migrate --force


      # Clear Laravel Cache

      - name: Clear Laravel Cache
        run: |
          docker compose exec -T app php artisan optimize:clear

