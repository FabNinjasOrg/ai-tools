name: Local CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - testing-facefinder

jobs:
  build-local:
    name: Local CI - Build & Dockerize
    runs-on: ubuntu-latest

    steps:

      # CHECKOUT CODE

      - name: Checkout code
        uses: actions/checkout@v3

      # INSTALL PHP 8.2

      - name: Install PHP 8.2
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install -y \
            php8.2 php8.2-cli php8.2-common php8.2-mbstring php8.2-xml \
            php8.2-zip php8.2-intl php8.2-curl php8.2-bcmath php8.2-gd php8.2-mysql

      # INSTALL COMPOSER DEPENDENCIES

      - name: Install PHP extensions + Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git libzip-dev libicu-dev
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction --prefer-dist --no-scripts

      # INSTALL NODE + BUILD FRONTEND

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Node packages
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      # BUILD DOCKER IMAGE

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag face_finder_app:latest \
            .

      # DOCKER COMPOSE BUILD & UP

      - name: Docker Compose Build Services
        run: docker compose build
        
