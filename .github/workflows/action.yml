name: CI/CD Build & Deploy

on:
  push:
    branches:
      - testing-facefinder
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1 — Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 3 — Build app image
      - name: Build app image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/face_finder_app:latest .

      # STEP 4 — Build face-recognition-apis image
      - name: Build face-recognition-apis image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition_apis:latest ./fast-api-face-rec

      # STEP 5 — Push both images
      - name: Push app image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/face_finder_app:latest

      - name: Push face-recognition image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition_apis:latest

      # STEP 6 — Deploy on EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            set -e

            cd /home/ubuntu/ai-tools

            # Pull new images
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/face_finder_app:latest
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition_apis:latest

            # Deploy docker warm stack
            sudo docker stack deploy -c docker-stack.yml facefinder || true

            # Adding loop here to check if the service is running before proceeding
            SERVICE_NAME="facefinder_face_finder_app"

            while true; do
              RUNNING=$(sudo docker service ps $SERVICE_NAME \
                          --filter "desired-state=running" \
                          --format "{{.CurrentState}}" | grep -c "Running")

              if [ "$RUNNING" -ge 1 ]; then
                echo "Container running"
                break
              fi

              echo "Waiting for container to reach Running state..."
              sleep 3
            done

            APP_CONTAINER=""

            while true; do
              APP_CONTAINER=$(sudo docker ps --filter "name=face_finder_app" -q | head -n 1)

              if [ -n "$APP_CONTAINER" ]; then
                echo "App container detected: $APP_CONTAINER"
                break
              fi

              echo "Waiting for app container to appear..."
              sleep 3
            done

            echo "Running migrations..."
            sudo docker exec $APP_CONTAINER php artisan migrate --force || true

            echo "Running optimize clear..."
            sudo docker exec $APP_CONTAINER php artisan optimize:clear || true
