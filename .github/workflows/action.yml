name: CI/CD Build & Deploy

on:
  push:
    branches:
      - testing-facefinder
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1 — Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 3 — Build app image
      - name: Build app image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/face_finder_app:latest .

      # STEP 4 — Build face-recognition-apis image
      - name: Build face-recognition-apis image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition_apis:latest ./fast-api-face-rec

      # STEP 5 — Push both images
      - name: Push app image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/face_finder_app:latest

      - name: Push face-recognition image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition_apis:latest

      # STEP 6 — Deploy on EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            set -e

            cd /ai-tools

            # Pull new images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/face_finder_app:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/face_recognition_apis:latest

            # Restart containers
            docker compose down
            docker compose up -d

            # Run migrations + clear cache
            docker compose exec -T app php artisan migrate --force || true
            docker compose exec -T app php artisan optimize:clear || true
