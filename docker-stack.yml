version: "3.9"

services:

  face_finder_app:
    image: harshfabninjas/face_finder_app:latest
    volumes:
      - public_data:/var/www/html/public
    networks:
      - laravel-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/var/www/html/public:ro
    networks:
      - laravel-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 2
      update_config:
        order: start-first

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: laravel
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 2
      placement:
        constraints:
          - node.role == manager

  scheduler-and-queue:
    image: harshfabninjas/face_finder_app:latest
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf", "-n"]
    networks:
      - laravel-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 2
      update_config:
        order: start-first

  face-recognition-apis:
    image: harshfabninjas/face_recognition_apis:latest
    ports:
      - "8005:8005"
    networks:
      - laravel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first

volumes:
  db_data:
  public_data:

networks:
  laravel-net:
    driver: overlay
